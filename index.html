</script>
<style>
:root{
  --navy:#0f2438;
  --navy-2:#16324f;
  --gold:#c9a24b;
  --gold-light:#e6c877;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#1c2b3a;
  --text-muted:#5b6b7a;
  --border:#e2e7ec;
  --green:#2e8b57;
  --red:#c0392b;
  --radius:12px;
  --shadow:0 1px 3px rgba(15,36,56,0.08), 0 1px 2px rgba(15,36,56,0.06);
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
header.top{
  background:linear-gradient(120deg,var(--navy),var(--navy-2));
  color:#fff;
  padding:22px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
}
header.top h1{
  margin:0;
  font-size:20px;
  font-weight:600;
  letter-spacing:0.2px;
}
header.top .sub{
  font-size:12.5px;
  color:#c7d3de;
  margin-top:3px;
}
header.top .badge{
  background:rgba(201,162,75,0.18);
  border:1px solid var(--gold);
  color:var(--gold-light);
  padding:5px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
}
main{
  max-width:1440px;
  margin:0 auto;
  padding:20px 28px 60px;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  padding:18px 20px;
}
.section-title{
  font-size:14px;
  font-weight:700;
  color:var(--navy);
  text-transform:uppercase;
  letter-spacing:0.6px;
  margin:0 0 14px 0;
  display:flex;
  align-items:center;
  gap:8px;
}
.section-title .dot{
  width:8px;height:8px;border-radius:50%;background:var(--gold);
}
.filters{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  align-items:flex-end;
  margin-bottom:20px;
}
.filter-group{
  display:flex;
  flex-direction:column;
  gap:6px;
  min-width:150px;
}
.filter-group label{
  font-size:11.5px;
  font-weight:600;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:0.4px;
}
select, .btn{
  font-family:inherit;
  font-size:13.5px;
  padding:8px 10px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
}
select{cursor:pointer;}
select:focus{outline:2px solid var(--gold-light);}
.months-picker{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  max-width:420px;
}
.month-chip{
  padding:5px 10px;
  border-radius:16px;
  border:1px solid var(--border);
  font-size:12px;
  cursor:pointer;
  user-select:none;
  background:#fff;
  color:var(--text-muted);
  transition:all .12s ease;
}
.month-chip.active{
  background:var(--navy);
  border-color:var(--navy);
  color:#fff;
}
.month-chip:hover{border-color:var(--navy);}
.btn{
  cursor:pointer;
  background:var(--navy);
  color:#fff;
  border:1px solid var(--navy);
  font-weight:600;
  transition:background .12s ease;
}
.btn:hover{background:var(--navy-2);}
.btn.secondary{
  background:#fff;
  color:var(--navy);
  border:1px solid var(--navy);
}
.btn.secondary:hover{background:#eef2f6;}
.btn.small{padding:5px 10px;font-size:12px;border-radius:6px;}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy);}
.btn.gold:hover{background:var(--gold-light);}

.kpi-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
  margin-bottom:20px;
}
.kpi{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px 16px;
  box-shadow:var(--shadow);
}
.kpi .label{
  font-size:11px;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:0.4px;
  font-weight:600;
}
.kpi .value{
  font-size:21px;
  font-weight:700;
  color:var(--navy);
  margin-top:4px;
}
.kpi .value.gold{color:#8a6d1f;}

.grid-2{
  display:grid;
  grid-template-columns:1.4fr 1fr;
  gap:18px;
  margin-bottom:18px;
}
@media(max-width:980px){.grid-2{grid-template-columns:1fr;}}

.chart-wrap{position:relative;height:340px;}
.chart-wrap.small{height:300px;}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
th,td{
  padding:8px 10px;
  text-align:right;
  border-bottom:1px solid var(--border);
}
th:first-child,td:first-child{text-align:left;}
th{
  color:var(--text-muted);
  font-weight:600;
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:0.3px;
}
tr:hover td{background:#f8fafb;}
.pos{color:var(--green);font-weight:600;}
.neg{color:var(--red);font-weight:600;}
.mono{font-variant-numeric:tabular-nums;}

.compare-controls{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  align-items:flex-start;
  margin-bottom:16px;
}
.years-picker{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  max-width:520px;
}
.year-chip{
  padding:5px 11px;
  border-radius:16px;
  border:1px solid var(--border);
  font-size:12px;
  cursor:pointer;
  user-select:none;
  background:#fff;
  color:var(--text-muted);
}
.year-chip.active{
  background:var(--gold);
  border-color:var(--gold);
  color:var(--navy);
  font-weight:700;
}
.year-chip:hover{border-color:var(--gold);}

/* Modal */
.modal-overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(15,36,56,0.55);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal-overlay.open{display:flex;}
.modal{
  background:#fff;
  border-radius:var(--radius);
  max-width:720px;
  width:100%;
  max-height:88vh;
  overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
}
.modal-head{
  padding:18px 22px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;top:0;background:#fff;border-radius:var(--radius) var(--radius) 0 0;
}
.modal-head h2{margin:0;font-size:17px;color:var(--navy);}
.modal-head .close{
  cursor:pointer;
  font-size:20px;
  color:var(--text-muted);
  background:none;
  border:none;
  line-height:1;
}
.modal-body{padding:18px 22px 24px;}
.modal-body table td:first-child{color:var(--text-muted);}
.modal-yoy{font-size:12px;color:var(--text-muted);margin-top:2px;}

footer{
  text-align:center;
  font-size:12px;
  color:var(--text-muted);
  padding:20px;
}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>MIR Estadísticas — Panel de Control</h1>
    <div class="sub">Datos mensuales de explotación hotelera</div>
  </div>
  <div class="badge" id="rangeBadge"></div>
</header>

<main>

  <!-- FILTERS -->
  <div class="card" style="margin-bottom:18px;">
    <div class="section-title"><span class="dot"></span>Filtros</div>
    <div class="filters">
      <div class="filter-group">

const METRICS = [{"id": "VENTAS", "label": "Ventas Totales", "unit": "currency", "agg": "sum"}, {"id": "ADR NETO", "label": "ADR Neto", "unit": "currency", "agg": "avg"}, {"id": "ESTANCIAS", "label": "Estancias", "unit": "num", "agg": "sum"}, {"id": "HAB", "label": "Habitaciones Vendidas", "unit": "num", "agg": "sum"}, {"id": "VENTAS PAQUETE", "label": "Ventas Paquete", "unit": "currency", "agg": "sum"}, {"id": "TARIFA PAQUETE", "label": "Tarifa Paquete", "unit": "currency", "agg": "avg"}, {"id": "COMIDAS EXTRAS", "label": "Comidas Extras", "unit": "currency", "agg": "sum"}, {"id": "BEBIDAS EXTRA", "label": "Bebidas Extra", "unit": "currency", "agg": "sum"}, {"id": "SPA", "label": "SPA", "unit": "currency", "agg": "sum"}, {"id": "COSTE DIRECTO", "label": "Coste Directo", "unit": "currency", "agg": "sum"}, {"id": "COSTE DE PERSONAL", "label": "Coste de Personal", "unit": "currency", "agg": "sum"}, {"id": "% ventas&personal", "label": "% Personal / Ventas", "unit": "percent", "agg": "avg"}, {"id": "Plantilla media", "label": "Plantilla Media", "unit": "num", "agg": "avg"}, {"id": "GASTOS OPERATIVOS", "label": "Gastos Operativos", "unit": "currency", "agg": "sum"}, {"id": "AGUA", "label": "Agua", "unit": "currency", "agg": "sum"}, {"id": "ELECTRICIDAD", "label": "Electricidad", "unit": "currency", "agg": "sum"}, {"id": "KW ELECT", "label": "kWh Electricidad", "unit": "num", "agg": "sum"}, {"id": "COMBUSTIBLE", "label": "Combustible", "unit": "currency", "agg": "sum"}, {"id": "HONORARIO VENTAS", "label": "Honorario Ventas", "unit": "currency", "agg": "sum"}, {"id": "G.O.P.", "label": "GOP", "unit": "currency", "agg": "sum"}, {"id": "HONORARIO Benef", "label": "Honorario Beneficio", "unit": "currency", "agg": "sum"}, {"id": "E.B.I.T.D.A.", "label": "EBITDA", "unit": "currency", "agg": "sum"}, {"id": "Ingreso Medio Estancia", "label": "Ingreso Medio por Estancia", "unit": "currency", "agg": "avg"}, {"id": "GOP * Habitacion", "label": "GOP por Habitación", "unit": "currency", "agg": "avg"}];
const MONTHS = ["ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO", "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"];
const METRIC_MAP = Object.fromEntries(METRICS.map(m => [m.id, m]));

function fmt(val, unit){
  if(val === undefined || val === null || isNaN(val)) return '—';
  if(unit === 'currency'){
    return new Intl.NumberFormat('es-ES', {maximumFractionDigits:0}).format(Math.round(val)) + ' €';
  }
  if(unit === 'percent'){
    return (val*100).toLocaleString('es-ES', {maximumFractionDigits:1}) + ' %';
  }
  return val.toLocaleString('es-ES', {maximumFractionDigits: (Math.abs(val) < 100 ? 2 : 0)});
}

function years(){
  return [...new Set(DATA.map(d => d['AÑO']))].sort((a,b)=>a-b);
}

// ---------- state ----------
const allYears = years();
let state = {
  yearFrom: allYears[0],
  yearTo: allYears[allYears.length-1],
  months: [...MONTHS],
  metric: 'VENTAS',
  compareMonth: MONTHS[new Date().getMonth()] || 'ENERO',
  compareMetric: 'VENTAS',
  compareYears: allYears.slice(-5),
};

// ---------- populate filter controls ----------
function populateSelect(sel, items, formatter){
  sel.innerHTML = '';
  items.forEach(it=>{
    const opt = document.createElement('option');
    opt.value = it.value; opt.textContent = it.label;
    sel.appendChild(opt);
  });
}

const yearFromSel = document.getElementById('yearFrom');
const yearToSel = document.getElementById('yearTo');
populateSelect(yearFromSel, allYears.map(y=>({value:y,label:y})));
populateSelect(yearToSel, allYears.map(y=>({value:y,label:y})));
yearFromSel.value = state.yearFrom;
yearToSel.value = state.yearTo;

const metricSel = document.getElementById('metricSelect');
populateSelect(metricSel, METRICS.map(m=>({value:m.id,label:m.label})));
metricSel.value = state.metric;

const compareMonthSel = document.getElementById('compareMonth');
populateSelect(compareMonthSel, MONTHS.map(m=>({value:m,label:m.charAt(0)+m.slice(1).toLowerCase()})));
compareMonthSel.value = state.compareMonth;

const compareMetricSel = document.getElementById('compareMetric');
populateSelect(compareMetricSel, METRICS.map(m=>({value:m.id,label:m.label})));
compareMetricSel.value = state.compareMetric;

const monthsPicker = document.getElementById('monthsPicker');
MONTHS.forEach(m=>{
  const chip = document.createElement('div');
  chip.className = 'month-chip active';
  chip.textContent = m.slice(0,3).charAt(0)+m.slice(1,3).toLowerCase();
  chip.dataset.month = m;
  chip.title = m;
  chip.addEventListener('click', ()=>{
    if(state.months.includes(m)){
      if(state.months.length === 1) return;
      state.months = state.months.filter(x=>x!==m);
      chip.classList.remove('active');
    } else {
      state.months.push(m);
      chip.classList.add('active');
    }
    render();
  });
  monthsPicker.appendChild(chip);
});

const yearsPicker = document.getElementById('yearsPicker');
function renderYearsPicker(){
  yearsPicker.innerHTML = '';
  allYears.forEach(y=>{
    const chip = document.createElement('div');
    chip.className = 'year-chip' + (state.compareYears.includes(y) ? ' active' : '');
    chip.textContent = y;
    chip.addEventListener('click', ()=>{
      if(state.compareYears.includes(y)){
        state.compareYears = state.compareYears.filter(x=>x!==y);
      } else {
        state.compareYears.push(y);
      }
      renderYearsPicker();
      renderCompare();
    });
    yearsPicker.appendChild(chip);
  });
}
renderYearsPicker();

document.getElementById('resetFilters').addEventListener('click', ()=>{
  state.yearFrom = allYears[0];
  state.yearTo = allYears[allYears.length-1];
  state.months = [...MONTHS];
  state.metric = 'VENTAS';
  yearFromSel.value = state.yearFrom;
  yearToSel.value = state.yearTo;
  metricSel.value = state.metric;
  [...monthsPicker.children].forEach(c=>c.classList.add('active'));
  render();
});

yearFromSel.addEventListener('change', ()=>{ state.yearFrom = +yearFromSel.value; render(); });
yearToSel.addEventListener('change', ()=>{ state.yearTo = +yearToSel.value; render(); });
metricSel.addEventListener('change', ()=>{ state.metric = metricSel.value; render(); });
compareMonthSel.addEventListener('change', ()=>{ state.compareMonth = compareMonthSel.value; renderCompare(); });
compareMetricSel.addEventListener('change', ()=>{ state.compareMetric = compareMetricSel.value; renderCompare(); });

// ---------- filtering ----------
function filteredData(){
  return DATA.filter(d => d['AÑO'] >= state.yearFrom && d['AÑO'] <= state.yearTo && state.months.includes(d['MES']))
    .sort((a,b)=> (a['AÑO']-b['AÑO']) || (MONTHS.indexOf(a['MES'])-MONTHS.indexOf(b['MES'])));
}

function aggregate(rows, metricId){
  const m = METRIC_MAP[metricId];
  const vals = rows.map(r=>r[metricId]).filter(v=>v!==undefined && v!==null);
  if(vals.length === 0) return null;
  if(m.agg === 'sum') return vals.reduce((a,b)=>a+b,0);
  return vals.reduce((a,b)=>a+b,0) / vals.length;
}

// ---------- KPI cards ----------
const kpiIds = ['VENTAS','ESTANCIAS','ADR NETO','COSTE DE PERSONAL','% ventas&personal','G.O.P.','E.B.I.T.D.A.'];
function renderKpis(){
  const rows = filteredData();
  const grid = document.getElementById('kpiGrid');
  grid.innerHTML = '';
  kpiIds.forEach(id=>{
    const m = METRIC_MAP[id];
    const val = aggregate(rows, id);
    const div = document.createElement('div');
    div.className = 'kpi';
    div.innerHTML = `<div class="label">${m.label}</div><div class="value">${fmt(val, m.unit)}</div>`;
    grid.appendChild(div);
  });
}

// ---------- trend chart ----------
let trendChartInstance = null;
function renderTrend(){
  const rows = filteredData();
  const m = METRIC_MAP[state.metric];
  const labels = rows.map(r => (r['MES'].slice(0,3).charAt(0)+r['MES'].slice(1,3).toLowerCase()) + " '" + String(r['AÑO']).slice(2));
  const values = rows.map(r => r[state.metric]);

  try{
    const ctx = document.getElementById('trendChart').getContext('2d');
    if(trendChartInstance) trendChartInstance.destroy();
    trendChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: m.label,
          data: values,
          borderColor: '#0f2438',
          backgroundColor: 'rgba(201,162,75,0.15)',
          pointRadius: rows.length > 60 ? 0 : 2,
          borderWidth: 2,
          fill: true,
          tension: 0.25,
        }]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{display:false},
          tooltip:{callbacks:{label: ctx => m.label+': '+fmt(ctx.parsed.y, m.unit)}}
        },
        scales:{
          y:{ ticks:{ callback: v => fmt(v, m.unit) } },
          x:{ ticks:{ maxRotation:60, minRotation:0, autoSkip:true, maxTicksLimit:24 } }
        }
      }
    });
  }catch(err){
    console.error('Error al dibujar el gráfico de evolución:', err);
  }
}

// ---------- comparison chart + table ----------
let compareChartInstance = null;
function renderCompare(){
  const m = METRIC_MAP[state.compareMetric];
  const yrs = [...state.compareYears].sort((a,b)=>a-b);
  const rowsByYear = {};
  yrs.forEach(y=>{
    const row = DATA.find(d => d['AÑO']===y && d['MES']===state.compareMonth);
    rowsByYear[y] = row ? row[state.compareMetric] : null;
  });

  try{
    const ctx = document.getElementById('compareChart').getContext('2d');
    if(compareChartInstance) compareChartInstance.destroy();
    compareChartInstance = new Chart(ctx, {
      type:'bar',
      data:{
        labels: yrs,
        datasets:[{
          label: m.label + ' — ' + (state.compareMonth.charAt(0)+state.compareMonth.slice(1).toLowerCase()),
          data: yrs.map(y=>rowsByYear[y]),
          backgroundColor: '#c9a24b',
          borderRadius: 4,
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{display:false},
          tooltip:{callbacks:{label: ctx => m.label+': '+fmt(ctx.parsed.y, m.unit)}}
        },
        scales:{ y:{ ticks:{ callback: v => fmt(v, m.unit) } } }
      }
    });
  }catch(err){
    console.error('Error al dibujar el gráfico comparativo:', err);
  }

  const tbody = document.getElementById('compareTableBody');
  tbody.innerHTML = '';
  yrs.forEach((y,i)=>{
    const val = rowsByYear[y];
    const prevVal = i>0 ? rowsByYear[yrs[i-1]] : null;
    let varCell = '—';
    if(prevVal !== null && prevVal !== undefined && val !== null && prevVal !== 0){
      const pct = ((val - prevVal)/Math.abs(prevVal))*100;
      const cls = pct >= 0 ? 'pos' : 'neg';
      const sign = pct >= 0 ? '+' : '';
      varCell = `<span class="${cls}">${sign}${pct.toFixed(1)}%</span>`;
    }
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${y}</td><td class="mono">${fmt(val, m.unit)}</td><td>${varCell}</td>
      <td><button class="btn small gold" data-year="${y}">Ver desglose</button></td>`;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('button[data-year]').forEach(btn=>{
    btn.addEventListener('click', ()=> openBreakdown(state.compareMonth, +btn.dataset.year));
  });
}

// ---------- breakdown modal ----------
const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');

function openBreakdown(mes, anio){
  const row = DATA.find(d => d['MES']===mes && d['AÑO']===anio);
  if(!row){
    modalTitle.textContent = 'Sin datos';
    modalBody.innerHTML = `<p>No hay datos para ${mes} ${anio}.</p>`;
    modalOverlay.classList.add('open');
    return;
  }
  const prevRow = DATA.find(d => d['MES']===mes && d['AÑO']===anio-1);
  modalTitle.textContent = `Desglose — ${mes.charAt(0)+mes.slice(1).toLowerCase()} ${anio}`;

  let rowsHtml = '';
  METRICS.forEach(m=>{
    const val = row[m.id];
    let yoy = '';
    if(prevRow){
      const prevVal = prevRow[m.id];
      if(prevVal !== undefined && prevVal !== null && prevVal !== 0 && val !== undefined && val !== null){
        const pct = ((val-prevVal)/Math.abs(prevVal))*100;
        const cls = pct >= 0 ? 'pos' : 'neg';
        const sign = pct >= 0 ? '+' : '';
        yoy = ` <span class="${cls}" style="font-weight:500;font-size:11.5px;">(${sign}${pct.toFixed(1)}% vs ${anio-1})</span>`;
      }
    }
    rowsHtml += `<tr><td>${m.label}</td><td class="mono">${fmt(val, m.unit)}${yoy}</td></tr>`;
  });

  modalBody.innerHTML = `<table><tbody>${rowsHtml}</tbody></table>`;
  modalOverlay.classList.add('open');
}

document.getElementById('modalClose').addEventListener('click', ()=> modalOverlay.classList.remove('open'));
modalOverlay.addEventListener('click', (e)=>{ if(e.target === modalOverlay) modalOverlay.classList.remove('open'); });

// ---------- global breakdown trigger from trend chart click ----------
document.getElementById('trendChart').addEventListener('click', (evt)=>{
  if(!trendChartInstance) return;
  const points = trendChartInstance.getElementsAtEventForMode(evt, 'nearest', {intersect:true}, true);
  if(points.length){
    const idx = points[0].index;
    const rows = filteredData();
    const r = rows[idx];
    if(r) openBreakdown(r['MES'], r['AÑO']);
  }
});

// ---------- render all ----------
function updateBadge(){
  document.getElementById('rangeBadge').textContent = `${allYears[0]}–${allYears[allYears.length-1]}`;
}

function render(){
  renderKpis();
  renderTrend();
  updateBadge();
}

renderCompare();
render();
</script>
